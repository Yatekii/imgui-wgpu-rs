[licenses]
allow = [
    "Apache-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
skip = [
    { name = "bitflags", version = "1.3.2", reason = "imgui depends on bitflags 1.x" },
    { crate = "hashbrown@0.16", reason = "gpu-allocator and naga lag behind" },
    { name = "jni-sys", version = "0.3.1", reason = "Using semver trick to depend on 0.4.1" },
    { crate = "syn@2", reason = "transitive dependencies have not migrated to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"

[advisories]
ignore = [
    # paste is unmaintained, but is complete.
    "RUSTSEC-2024-0436",
    # ttf-parser is a transitive dependency of winit.
    "RUSTSEC-2026-0192",
]
